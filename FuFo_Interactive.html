<style>
:root{--navy:#1e3a5f;--green:#1a7a4a;--blue:#1a4f8a;--muted:#94a3b8;--border:#e2e8f0}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'IBM Plex Sans',sans-serif;background:#f0f4f8;color:#1e293b;min-height:100vh;display:flex;flex-direction:column}
header{background:var(--navy);padding:12px 24px 10px;border-bottom:3px solid var(--green);flex-shrink:0;display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px}
.h-left .tag{font-family:'IBM Plex Mono',monospace;font-size:8px;letter-spacing:.2em;color:#6bcf9e;text-transform:uppercase;margin-bottom:3px}
.h-left h1{font-size:16px;font-weight:700;color:#fff;letter-spacing:-.02em}

.h-right{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.leg{display:flex;align-items:center;gap:4px;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#94a3b8}
.leg-line{width:20px;height:2px;border-radius:1px}
.leg-dash{width:20px;height:0;border-top:2px dashed}
.toolbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 20px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.filter-btn{background:#f8fafc;border:1.5px solid var(--border);border-radius:5px;padding:4px 12px;font-size:11px;font-family:'IBM Plex Mono',monospace;cursor:pointer;transition:all .15s;color:#475569}
.filter-btn:hover,.filter-btn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
#reset-btn{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.3);color:#c0392b;font-family:'IBM Plex Mono',monospace;font-size:10px;padding:4px 12px;border-radius:5px;cursor:pointer;display:none}
.canvas-wrap{flex:1;overflow:auto;position:relative;min-height:200px}
#canvas{position:relative}
#arrows{position:absolute;top:0;left:0;pointer-events:none;overflow:visible;z-index:10}
.layer-band{position:absolute;left:0;right:0;z-index:1}
.layer-label{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;padding:4px 14px 3px}
.node{position:absolute;border-radius:8px;background:#fff;cursor:pointer;transition:box-shadow .15s,opacity .2s;overflow:hidden;z-index:20}
.node:hover{box-shadow:0 4px 20px rgba(0,0,0,.15)}
.node.active{box-shadow:0 6px 24px rgba(0,0,0,.2)}
.node.dimmed{opacity:.15;pointer-events:none}
.node-head{padding:7px 10px 5px;border-bottom:1px solid #f1f5f9}
.node-title{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;line-height:1.3;margin-bottom:2px}
.node-body{padding:6px 10px}
.node-detail{font-size:9.5px;color:#94a3b8;line-height:1.5}
.node-hire{font-size:9px;margin-top:4px;padding-top:4px;border-top:1px solid #f1f5f9}
.node.banner{display:flex;align-items:center}
.node.banner .node-head{border-bottom:none;border-right:1px solid #f1f5f9;flex-shrink:0;width:280px;padding:8px 14px}
.node.banner .node-body{flex:1;padding:6px 14px}
#info-panel{position:fixed;bottom:0;left:0;right:0;background:var(--navy);color:#fff;border-top:3px solid var(--green);padding:12px 24px;display:none;z-index:100;font-family:'IBM Plex Mono',monospace}
#info-panel.visible{display:grid;grid-template-columns:1fr auto}
#info-title{font-weight:700;font-size:13px;color:#6bcf9e;margin-bottom:3px}
#info-pi{color:#cbd5e1;font-size:10px;margin-bottom:3px;font-family:'IBM Plex Sans',sans-serif}
#info-desc{color:#94a3b8;font-size:10px;line-height:1.5;font-family:'IBM Plex Sans',sans-serif;max-width:900px}
#info-connects{color:#64748b;font-size:9px;margin-top:3px}
#info-hire{color:#6bcf9e;font-size:10px;text-align:right;align-self:start;white-space:nowrap;padding-left:20px}

function ldef(id){return LD.find(function(l){return l.id===id})}

function estimateWidth(n){
  // Width based on longest bullet text, ~5.5px per char at 9.5px font + padding
  var maxLen=0;
  if(n.d)n.d.forEach(function(s){if(s.length>maxLen)maxLen=s.length});
  var title=n.t?n.t.length:0;
  if(title>maxLen)maxLen=title;
  var w=Math.max(220, Math.min(480, maxLen*5.2+60));
  return Math.round(w);
}

function layoutRow(ids,layerIdx,yOff,fixedH){
  var L=LD[layerIdx];
  var nodes=ids.map(function(id){return NODES.find(function(x){return x.id===id})});
  var widths=nodes.map(function(n){return n.ban?estimateWidth(n)+100:estimateWidth(n)});
  var totalW=widths.reduce(function(a,b){return a+b},0)+GAP*(nodes.length-1);
  var startX=(CW-totalW)/2;
  var x=startX;
  nodes.forEach(function(n,i){
    n._x=x;n._y=L.y+yOff;n._w=widths[i];n._h=fixedH;
    x+=widths[i]+GAP;
  });
}

    var ls=n.ld&&n.ld.length?n.ld.join(', '):'';
    var cs=n.co&&n.co.length?n.co.join(', '):'';
    var lh=ls?'<div style="font-size:10px;line-height:1.5;margin-top:2px"><span style="font-family:IBM Plex Mono,monospace;font-size:8px;font-weight:700;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase">Lead</span> '+ls+'</div>':'';
    var ch=cs?'<div style="font-size:10px;line-height:1.5"><span style="font-family:IBM Plex Mono,monospace;font-size:8px;font-weight:700;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase">Also</span> '+cs+'</div>':'';
    var nm='<div style="margin-top:3px">'+lh+ch+'</div>';
    var dl='<ul class="node-detail" style="padding-left:14px;list-style:disc">'+n.d.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
    var hh=(n.hi&&n.hi.indexOf('TBD')!==0)?'<div class="node-hire" style="color:'+hc+'">'+(n.ban?'':'<span style="font-family:IBM Plex Mono,monospace;font-size:8px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em">Researcher:</span><br>')+n.hi+'</div>':'';
    if(n.ban){
      d.innerHTML='<div class="node-head" style="background:'+n.st+'18"><div class="node-title" style="color:'+n.ic+';font-size:12px">'+n.t+'</div>'+nm+'</div><div class="node-body">'+dl+hh+'</div>';
    }else{
      d.innerHTML='<div class="node-head" style="background:'+n.st+'18"><div class="node-title" style="color:'+n.ic+'">'+n.t+'</div>'+nm+'</div><div class="node-body">'+dl+hh+'</div>';
    }
    d.addEventListener('click',function(){onNodeClick(n.id)});
    cv.appendChild(d);nEls[n.id]=d;
  });
}

function renderArrows(){
  var svg=document.getElementById('arrows');
  svg.setAttribute('width',CW);svg.setAttribute('height',CH);
  svg.setAttribute('viewBox','0 0 '+CW+' '+CH);
  var df=svg.querySelector('defs');
  var NS='http://www.w3.org/2000/svg';
  function se(t,a){var e=document.createElementNS(NS,t);if(a)Object.keys(a).forEach(function(k){e.setAttribute(k,a[k])});return e}
  Object.keys(CS).forEach(function(ty){
    var s=CS[ty];
    var m=se('marker',{id:'a-'+ty,markerWidth:'8',markerHeight:'7',refX:'7',refY:'3.5',orient:'auto'});
    m.appendChild(se('polygon',{points:'0 0,8 3.5,0 7',fill:s.s}));df.appendChild(m);
  });
  CO.forEach(function(c){
    var f=c[0],t=c[1],ty=c[2];
    var fn=NODES.find(function(x){return x.id===f});
    var tn=NODES.find(function(x){return x.id===t});
    if(!fn||!tn)return;
    var s=CS[ty];
    var x1=fn._x+fn._w/2,x2=tn._x+tn._w/2,y1,y2;
    var o=(ty==='coupling')?(f<t?-8:8):0;
    if(fn.l<tn.l){y1=fn._y+fn._h;y2=tn._y}
    else if(fn.l>tn.l){y1=fn._y;y2=tn._y+tn._h}
    else{y1=fn._y-2;y2=tn._y-2}
    var mx=(x1+x2)/2+o;
    var my=(fn.l===tn.l)?Math.min(fn._y,tn._y)-35:(y1+y2)/2;
    var p=se('path',{d:'M '+(x1+o)+' '+y1+' Q '+mx+' '+my+' '+(x2+o)+' '+y2,
      stroke:s.s,'stroke-width':s.w,'stroke-dasharray':s.d,fill:'none',
      'stroke-linecap':'round','marker-end':'url(#a-'+ty+')',class:'conn'});
    p.style.cssText='opacity:0;transition:opacity .2s';
    cEls[f+'|||'+t]=p;svg.appendChild(p);
  });
}

var activeNode=null;

function onNodeClick(id){
  if(activeNode===id){resetAll();return}
  activeNode=id;
  document.getElementById('reset-btn').style.display='block';
  var cn=adj[id];
  NODES.forEach(function(n){
    var e=nEls[n.id];e.classList.remove('active','dimmed');
    if(n.id===id)e.classList.add('active');
    else if(!cn.has(n.id))e.classList.add('dimmed');
  });
  Object.keys(cEls).forEach(function(k){
    var p=cEls[k],parts=k.split('|||');
    p.style.opacity=(parts[0]===id||parts[1]===id)?'1':'0';
  });
  var nd=NODES.find(function(x){return x.id===id});
  document.getElementById('info-title').textContent=nd.t;
  var ll=nd.ld&&nd.ld.length?'Lead: '+nd.ld.join(', '):'';
  var cl=nd.co&&nd.co.length?'Also: '+nd.co.join(', '):'';
  document.getElementById('info-pi').textContent=ll+(ll&&cl?'  \u00b7  ':'')+cl;
  var de=document.getElementById('info-desc');
  de.innerHTML='<ul style="margin:4px 0 0 0;padding-left:16px;list-style:disc">'+nd.de.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
  var bt={data:[],validation:[],coupling:[],lateral:[],conceptual:[]};
  CO.forEach(function(c){
    if(c[0]===id){var cn2=NODES.find(function(x){return x.id===c[1]});if(cn2)bt[c[2]].push('\u2192 '+cn2.t)}
    else if(c[1]===id&&c[2]!=='coupling'){var cn2=NODES.find(function(x){return x.id===c[0]});if(cn2)bt[c[2]].push('\u2190 '+cn2.t)}
  });
  var tl={data:'Data',validation:'Validation',coupling:'Coupling',lateral:'Lateral',conceptual:'Conceptual'};
  document.getElementById('info-connects').innerHTML=Object.keys(bt).filter(function(ty){return bt[ty].length}).map(function(ty){return '<span style="color:'+CS[ty].s+';font-weight:600">'+tl[ty]+':</span> '+bt[ty].join(' \u00b7 ')}).join('&emsp;');
  var he=document.getElementById('info-hire');
  he.textContent=(nd.hi&&nd.hi.indexOf('TBD')!==0)?nd.hi:'';
  he.style.display=(nd.hi&&nd.hi.indexOf('TBD')!==0)?'':'none';
  document.getElementById('info-panel').classList.add('visible');
}

function resetAll(){
  activeNode=null;
  NODES.forEach(function(n){nEls[n.id].classList.remove('active','dimmed')});
  Object.keys(cEls).forEach(function(k){cEls[k].style.opacity='0'});
  document.getElementById('info-panel').classList.remove('visible');
  document.getElementById('reset-btn').style.display='none';
}

function filt(c,b){
  document.querySelectorAll('.filter-btn').forEach(function(x){x.classList.remove('active')});
  b.classList.add('active');
  NODES.forEach(function(n){nEls[n.id].style.display=(c==='all'||n.c===c)?'':'none'});
}

layout();renderBands();renderNodes();renderArrows();
</script>
</body>
</html>

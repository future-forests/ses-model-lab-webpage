<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --sans:'IBM Plex Sans',system-ui,sans-serif;
  --ink:#181d2b; --ink2:#525a75; --ink3:#8a92ab;
  --page:#f7f8fb; --card:#fff; --line:#e3e7f0;
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--page);color:var(--ink);line-height:1.5;padding-bottom:56px}

header.top{background:#fff;border-bottom:2px solid var(--ink);padding:22px 32px 16px;
  position:sticky;top:0;z-index:50}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:5px}
h1{font-size:23px;font-weight:700;letter-spacing:-.025em;line-height:1.15}
.lede{font-size:12.5px;color:var(--ink2);max-width:74ch;margin-top:5px}
.counts{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:7px}

.filters{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.flabel{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);width:58px;flex:none}
button.f{font-family:var(--mono);font-size:11px;padding:4px 11px;border-radius:20px;
  border:1.5px solid var(--c,#cfd6e4);background:#fff;color:var(--c,var(--ink2));
  cursor:pointer;font-weight:600;transition:background .15s,color .15s}
button.f:hover{background:var(--bg,#eef1f7)}
button.f[aria-pressed="true"]{background:var(--c,var(--ink));color:#fff;border-color:var(--c,var(--ink))}
button.f:focus-visible{outline:2px solid #1a4f8a;outline-offset:2px}

main{padding:26px 32px 0;max-width:1560px;margin:0 auto}
.grouphead{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink3);border-top:1px solid var(--line);padding-top:8px;margin:30px 0 4px}
.grouphead:first-child{margin-top:0}
section.ra{margin-bottom:26px}
.rahead{display:flex;align-items:baseline;gap:11px;padding:0 0 9px 14px;margin-bottom:14px;
  border-bottom:1px solid var(--line)}
.racode{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.02em}
.raname{font-size:14.5px;font-weight:600}
.racount{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-left:auto}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));
  gap:15px;align-items:start}
article.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:8px;padding:16px 18px;box-shadow:0 1px 3px rgba(20,30,60,.05)}
article.card.wide{grid-column:1/-1}
.ctitle{font-size:16.5px;font-weight:700;color:var(--c);letter-spacing:-.012em}
.csub{font-size:11.5px;color:var(--ink2);font-style:italic;margin-top:2px}
.cpi{font-size:12.5px;margin-top:5px}
.calso{font-size:11px;color:var(--ink2);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.tag{font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;
  background:#f1f4f9;color:#4a5570}
.tag.tool{background:var(--bg);color:var(--c)}
ul.bul{margin:9px 0 0;padding-left:17px;font-size:12px;color:var(--ink2)}
ul.bul li{margin-bottom:3px}
ol.obj{margin:0;padding-left:17px;font-size:11.5px;color:var(--ink2)}
ol.obj li{margin-bottom:3px}
.sublabel{font-family:var(--mono);font-size:8.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.block{margin-top:11px}
.team{margin-top:11px;padding-top:8px;border-top:1px solid var(--line)}
.person{font-size:11.5px;margin-bottom:2px}
.person .role{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.person.vacant{color:var(--ink3)}
.person.vacant .role{color:#b45309}
.io{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px;
  padding-top:10px;border-top:1px solid var(--line)}
.io p{font-size:11.5px;font-weight:500;margin-bottom:5px;color:var(--ink)}
.note{font-size:11.5px;color:var(--ink2);margin-top:8px}
.partners{font-size:11px;color:var(--ink2);margin-top:5px}
.clink{display:inline-block;margin-top:9px;font-size:11.5px;color:var(--c)}
.empty{font-family:var(--mono);font-size:12px;color:var(--ink3);padding:40px 0;text-align:center}
footer{font-family:var(--mono);font-size:10px;color:var(--ink3);text-align:center;
  margin:40px auto 0;padding-top:16px;border-top:1px solid var(--line);max-width:1560px}
footer a{color:#1a4f8a}
@media (max-width:820px){
  header.top{padding:16px 14px 12px;position:static}
  main{padding:18px 14px 0}
  .grid{grid-template-columns:1fr}
  .io{grid-template-columns:1fr}
  .flabel{width:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

    data-labels="${(e.labels||[]).join(' ')}" data-vacant="${(e.team||[]).some(p=>p.v)?1:0}">`;
  h += `<div class="ctitle">${esc(e.title)}</div>`;
  if(e.subtitle) h += `<div class="csub">${esc(e.subtitle)}</div>`;
  if(e.pis) h += `<div class="cpi">${esc(e.pis)}</div>`;
  if(e.also) h += `<div class="calso">Außerdem: ${esc(e.also)}</div>`;
  if(e.partners) h += `<div class="partners"><strong>Projektpartner:</strong> ${esc(e.partners)}</div>`;
  const tags = [];
  (e.methods||[]).forEach(t => tags.push(`<span class="tag">${esc(t)}</span>`));
  (e.tools||[]).forEach(t => tags.push(`<span class="tag tool">${esc(t)}</span>`));
  if(tags.length) h += `<div class="tags">${tags.join('')}</div>`;
  if(e.note) h += `<div class="note">${esc(e.note)}</div>`;
  if(e.bullets) h += `<ul class="bul">${e.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`;
  if(e.objectives) h += `<div class="block"><div class="sublabel">Forschungsziele</div>
    <ol class="obj">${e.objectives.map(o=>`<li>${esc(o)}</li>`).join('')}</ol></div>`;
  if(e.team && e.team.length) h += `<div class="team"><div class="sublabel">Team</div>
    ${e.team.map(personHTML).join('')}</div>`;
  if(e.inputs || e.outputs){
    h += `<div class="io"><div><div class="sublabel">Eingangsdaten</div>` +
      (e.inputs ? e.inputs.map(i=>`<p>${esc(i)}</p>`).join('') : '<p style="color:#8a92ab">\u2014</p>') +
      `</div><div><div class="sublabel">Ergebnisse</div>` +
      (e.outputs ? e.outputs.map(o=>`<p>${esc(o)}</p>`).join('') : '<p style="color:#8a92ab">\u2014</p>') +
      `</div></div>`;
  }
  if(e.link) h += `<a class="clink" href="${e.link[0]}" target="_blank" rel="noopener">\u2197 ${esc(e.link[1])}</a>`;
  h += `</article>`;
  return h;
}

function visible(e){
  if(fRA !== 'all' && e.ra !== fRA) return false;
  if(fMethod && !(e.labels||[]).includes(fMethod)) return false;
  if(fVacant && !(e.team||[]).some(p=>p.v)) return false;
  return true;
}

function render(){
  const shown = ENTRIES.filter(visible);
  let html = '';
  for(const [gname, ras] of GROUPS){
    const inGroup = ras.filter(ra => shown.some(e => e.ra === ra));
    if(!inGroup.length) continue;
    html += `<div class="grouphead">${gname}</div>`;
    for(const ra of inGroup){
      const m = RA_META[ra];
      const items = shown.filter(e => e.ra === ra);
      html += `<section class="ra" style="--c:${m.c};--bg:${m.bg}">
        <div class="rahead" style="border-left:4px solid ${m.c}">
          <span class="racode" style="color:${m.c}">${ra === 'ST' ? 'C' : ra === 'INC' ? '\u2022' : ra === 'EXT' ? '\u2022' : ra}</span>
          <span class="raname">${m.n}</span>
          <span class="racount">${items.length} ${items.length===1?'Projekt':'Projekte'}</span>
        </div>
        <div class="grid">${items.map(cardHTML).join('')}</div></section>`;
    }
  }
  $('#out').innerHTML = html || '<div class="empty">Keine Projekte entsprechen diesen Filtern.</div>';
  $('#shown').textContent = shown.length;
}

function setRA(v, btn){
  fRA = v;
  document.querySelectorAll('[data-ra-btn]').forEach(b => b.setAttribute('aria-pressed', b === btn));
  render();
}
function setMethod(v, btn){
  const on = fMethod !== v;
  fMethod = on ? v : null;
  document.querySelectorAll('[data-m-btn]').forEach(b => b.setAttribute('aria-pressed', on && b === btn));
  render();
}
function setVacant(btn){
  fVacant = !fVacant;
  btn.setAttribute('aria-pressed', fVacant);
  render();
}
render();

</script>
</body>
</html>

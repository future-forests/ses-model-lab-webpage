
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--color-background-tertiary);color:var(--color-text-primary)}
.layout{display:grid;grid-template-columns:260px 1fr;gap:12px;padding:12px;min-height:520px}
.panel{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);display:flex;flex-direction:column;overflow:hidden}
.panel-head{padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary);flex-shrink:0}
.panel-title{font-size:11px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input[type=text]{width:100%;font-size:12px;padding:5px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary);color:var(--color-text-primary);outline:none;margin-bottom:6px}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.ftag{font-size:10px;font-weight:500;padding:2px 8px;border-radius:20px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:var(--color-background-secondary);color:var(--color-text-secondary);transition:all .12s}
.ftag.active-all{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.ftag.active-A{background:#1a7a4a;color:#fff;border-color:#1a7a4a}
.ftag.active-B{background:#1a4f8a;color:#fff;border-color:#1a4f8a}
.ftag.active-C{background:#c47a00;color:#fff;border-color:#c47a00}
.people-list{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:4px}
.pcard{padding:7px 9px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);background:var(--color-background-primary);cursor:pointer;transition:all .12s;user-select:none}
.pcard:hover{border-color:var(--color-border-primary);background:var(--color-background-secondary)}
.pcard.selected{border-color:#2a7ae2;background:#e8f2fd;box-shadow:0 0 0 2px #2a7ae255}
.pcard.placed{opacity:.35;pointer-events:none}
.pcard-name{font-size:12px;font-weight:500;color:var(--color-text-primary)}
.pcard-meta{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
.tag{font-size:9px;font-weight:600;padding:1px 5px;border-radius:3px}
.tag-A{background:#edf7f1;color:#1a7a4a}
.tag-B{background:#edf2fa;color:#1a4f8a}
.tag-C{background:#fdf6e3;color:#c47a00}
.tag-na{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.role-tag{font-size:9px;color:var(--color-text-secondary)}

.board-area{display:flex;flex-direction:column;gap:10px}
.board-scroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;min-height:200px;align-items:flex-start}
.board-scroll::-webkit-scrollbar{height:4px}
.board-scroll::-webkit-scrollbar-thumb{background:var(--color-border-secondary);border-radius:2px}
.lane{width:210px;flex-shrink:0;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);display:flex;flex-direction:column;max-height:420px}
.lane.drop-ready{border-color:#2a7ae2;background:#f0f7ff}
.lane-head{padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;gap:6px;flex-shrink:0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.lane-name-input{flex:1;font-size:12px;font-weight:500;border:none;outline:none;background:transparent;color:var(--color-text-primary);min-width:0}
.lane-del{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:14px;padding:0 2px;line-height:1;opacity:0;transition:opacity .12s}
.lane:hover .lane-del{opacity:1}
.lane-del:hover{color:#dc2626}
.lane-body{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px}
.lane-body::-webkit-scrollbar{width:3px}
.drop-hint{font-size:11px;color:var(--color-text-secondary);text-align:center;padding:16px 8px;border:0.5px dashed var(--color-border-tertiary);border-radius:var(--border-radius-md)}
.drop-hint.ready{border-color:#2a7ae2;color:#2a7ae2;background:#f0f7ff;cursor:pointer;font-weight:500}
.lane-member{display:flex;align-items:center;justify-content:space-between;padding:5px 7px;border-radius:var(--border-radius-md);background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);gap:6px}
.member-name{font-size:11px;font-weight:500;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-tag{font-size:9px;font-weight:600;padding:1px 4px;border-radius:3px;flex-shrink:0}
.rm-btn{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:13px;padding:0;line-height:1;flex-shrink:0;opacity:0;transition:opacity .12s}
.lane-member:hover .rm-btn{opacity:1}
.rm-btn:hover{color:#dc2626}

.add-lane-btn{flex-shrink:0;width:210px;padding:10px;border-radius:var(--border-radius-lg);border:0.5px dashed var(--color-border-secondary);background:transparent;color:var(--color-text-secondary);font-size:12px;cursor:pointer;transition:all .12s;text-align:center}
.add-lane-btn:hover{border-color:#2a7ae2;color:#2a7ae2}

.hint-bar{font-size:11px;color:var(--color-text-secondary);padding:6px 10px;background:var(--color-background-secondary);border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;justify-content:space-between}
.hint-bar.selecting{color:#2a7ae2;background:#e8f2fd;border-color:#2a7ae2}
.save-btn{font-size:11px;font-weight:500;padding:5px 12px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);cursor:pointer;transition:all .12s}
.save-btn:hover{background:#2a7ae2;color:#fff;border-color:#2a7ae2}
.save-btn:disabled{opacity:.4;cursor:default}

.empty-board{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;color:var(--color-text-secondary);font-size:12px;text-align:center;min-height:200px}
</style>

let lanes = [];
let selected = null;
let filterRA = 'all';

function placed(name){ return lanes.some(l=>l.members.includes(name)); }

function render(){
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('peopleList');
  const vis = PEOPLE.filter(p=>{
    if(filterRA!=='all'&&p.ra!==filterRA) return false;
    if(q&&!p.name.toLowerCase().includes(q)&&!p.projects.some(x=>x.toLowerCase().includes(q))&&!p.theme.toLowerCase().includes(q)) return false;
    return true;
  });
  document.getElementById('cnt').textContent='('+vis.length+')';
  list.innerHTML=vis.map(p=>{
    const isSel=selected===p.name;
    const isPlaced=placed(p.name);
    return `<div class="pcard${isSel?' selected':''}${isPlaced?' placed':''}" onclick="selectPerson('${esc(p.name)}')" title="${esc(p.projects.join(', '))||p.theme}">
      <div class="pcard-name">${p.name}</div>
      <div class="pcard-meta">
        <span class="tag tag-${p.ra}">${p.ra==='na'?'—':p.ra}</span>
        ${p.theme!=='na'?`<span class="tag tag-${p.ra}">${p.theme}</span>`:''}
        <span class="role-tag">${p.role}</span>
      </div>
    </div>`;
  }).join('');
  renderBoard();
  updateHint();
}

function selectPerson(name){
  if(placed(name)) return;
  selected = selected===name ? null : name;
  render();
}

function setFilter(ra, el){
  filterRA=ra;
  document.querySelectorAll('.ftag').forEach(e=>e.className='ftag');
  el.classList.add('active-'+ra);
  render();
}

function addToLane(laneId){
  if(!selected) return;
  const lane=lanes.find(l=>l.id===laneId);
  if(!lane||lane.members.includes(selected)) return;
  lane.members.push(selected);
  selected=null;
  render();
}

function removeFromLane(laneId, name){
  const lane=lanes.find(l=>l.id===laneId);
  if(lane) lane.members=lane.members.filter(m=>m!==name);
  render();
}

function newLane(){
  const name=prompt('Collaboration group name (e.g. "Drought A3–C3"):');
  if(!name||!name.trim()) return;
  lanes.push({id:'lane_'+Date.now(), title:name.trim(), color:COLORS[colorIdx++%COLORS.length], members:[]});
  render();
}

function deleteLane(id){
  if(!confirm('Delete this group?')) return;
  lanes=lanes.filter(l=>l.id!==id);
  render();
}

function renderBoard(){
  const scroll=document.getElementById('boardScroll');
  const empty=document.getElementById('emptyBoard');
  const addBtn=document.getElementById('addBtn');
  if(!scroll) return;

  // Remove old lanes but keep empty state and add button
  scroll.querySelectorAll('.lane').forEach(el=>el.remove());

  if(lanes.length===0){
    empty.style.display='';
  } else {
    empty.style.display='none';
  }

  // Insert lanes before the add button
  lanes.forEach(lane=>{
    const el=document.createElement('div');
    el.className='lane'+(selected?' drop-ready':'');
    el.id='lane-'+lane.id;
    el.innerHTML=`
      <div class="lane-head">
        <div class="dot" style="background:${lane.color}"></div>
        <input class="lane-name-input" value="${esc(lane.title)}" oninput="renameLane('${lane.id}',this.value)">
        <button class="lane-del" onclick="deleteLane('${lane.id}')" title="Delete">×</button>
      </div>
      <div class="lane-body">
        ${lane.members.length===0
          ? `<div class="drop-hint${selected?' ready':''}" onclick="addToLane('${lane.id}')">${selected?'Click to add '+selected:'Select a person first'}</div>`
          : lane.members.map(name=>{
              const p=PEOPLE.find(x=>x.name===name)||{name,ra:'na',theme:'na'};
              return `<div class="lane-member">
                <span class="member-name" title="${name}">${name}</span>
                <span class="member-tag tag-${p.ra}">${p.ra==='na'?'—':p.ra}</span>
                <button class="rm-btn" onclick="removeFromLane('${lane.id}','${esc(name)}')" title="Remove">×</button>
              </div>`;
            }).join('')
          + (selected?`<div class="drop-hint ready" onclick="addToLane('${lane.id}')">+ Add ${selected}</div>`:'')
        }
      </div>`;
    scroll.insertBefore(el, addBtn);
  });
}

function renameLane(id, val){
  const lane=lanes.find(l=>l.id===id);
  if(lane) lane.title=val;
}

function updateHint(){
  const bar=document.getElementById('hintBar');
  const txt=document.getElementById('hintText');
  if(selected){
    bar.className='hint-bar selecting';
    txt.textContent='Selected: '+selected+' — now click a group to add them';
  } else {
    bar.className='hint-bar';
    txt.textContent='← Select a person, then click a collaboration group to add them';
  }
}

async function save(){
  const btn=document.getElementById('saveBtn');
  btn.textContent='Saving…';
  btn.disabled=true;
  const yaml=buildYaml();
  const content=btoa(unescape(encodeURIComponent(yaml)));
  const url=`${GITLAB_BASE}/api/v4/projects/${PROJECT_PATH}/repository/files/${encodeURIComponent(FILE_PATH)}`;
  let exists=false;
  try{
    const r=await fetch(`${url}?ref=${BRANCH}`,{headers:{'PRIVATE-TOKEN':TOKEN}});
    exists=r.ok;
  }catch(e){}
  try{
    const r=await fetch(url,{
      method:exists?'PUT':'POST',
      headers:{'PRIVATE-TOKEN':TOKEN,'Content-Type':'application/json'},
      body:JSON.stringify({branch:BRANCH,content,encoding:'base64',commit_message:'Update collaborations '+new Date().toISOString().slice(0,16)})
    });
    if(!r.ok) throw new Error((await r.json()).message||r.status);
    btn.textContent='Saved ✓';
    setTimeout(()=>{btn.textContent='Save to GitLab';btn.disabled=false;},2000);
  }catch(err){
    btn.textContent='Error — try again';
    btn.disabled=false;
    alert('Save failed: '+err.message);
  }
}

async function loadFromGitLab(){
  try{
    const url=`${GITLAB_BASE}/api/v4/projects/${PROJECT_PATH}/repository/files/${encodeURIComponent(FILE_PATH)}?ref=${BRANCH}`;
    const r=await fetch(url,{headers:{'PRIVATE-TOKEN':TOKEN}});
    if(!r.ok) return;
    const d=await r.json();
    const yaml=atob(d.content.replace(/\n/g,''));
    const parsed=parseYaml(yaml);
    if(parsed.length) { lanes=parsed; colorIdx=lanes.length; render(); }
  }catch(e){ console.warn('GitLab load:',e); }
}

function buildYaml(){
  let s='# FuFo Collaboration Board\n# '+new Date().toISOString()+'\ncollaborations:\n';
  for(const l of lanes){
    s+=`  - id: "${l.id}"\n    title: "${l.title.replace(/"/g,'\\"')}"\n    color: "${l.color}"\n    members:\n`;
    for(const m of l.members) s+=`      - "${m.replace(/"/g,'\\"')}"\n`;
  }
  return s;
}

function parseYaml(yaml){
  const res=[];let cur=null,inM=false;
  for(const line of yaml.split('\n')){
    const t=line.trim();
    if(t.startsWith('- id:')){if(cur)res.push(cur);cur={id:ex(t),title:'',color:'#1e3a5f',members:[]};inM=false;}
    else if(cur&&t.startsWith('title:'))cur.title=ex(t);
    else if(cur&&t.startsWith('color:'))cur.color=ex(t);
    else if(cur&&t==='members:')inM=true;
    else if(cur&&inM&&t.startsWith('- "'))cur.members.push(ex('x: '+t.slice(2)));
  }
  if(cur)res.push(cur);
  return res;
}
function ex(line){const m=line.match(/:\s*"(.*)"/);return m?m[1].replace(/\\"/g,'"'):'';}
function esc(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

render();
loadFromGitLab();
</script>

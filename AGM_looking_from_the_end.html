<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Looking at the cluster from the end</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7; --ink:#191C18; --ink2:#5C6058; --ink3:#93968D; --rule:#E3E1D9;
    --route:#3D6FA8; --soc:#6F5FA8; --bio:#5C7A2E; --eco:#8C6239;
    --node:#E0A63C; --nodeink:#5A4110; --dead:#A3453B; --tgt:#2F7D5C;
    --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);
       display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
  .deck{width:min(1360px,96vw);display:flex;flex-direction:column;height:100vh;padding:2vh 0 1.2vh;transition:width .25s}
  body.editing .deck{width:min(1360px,58vw);margin-right:auto;margin-left:2vw}

  .top{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
  .eyebrow{font-family:var(--mono);font-size:clamp(10px,.95vw,14px);color:var(--ink3);letter-spacing:.04em}
  .dots{display:flex;gap:5px;align-items:center}
  .dots span{width:6px;height:6px;border-radius:50%;background:var(--rule);transition:all .3s;cursor:pointer}
  .dots span.on{background:var(--route);transform:scale(1.6)}
  .dots i{width:11px;display:inline-block}

  h1{margin-top:.4vh;font-size:clamp(20px,2.5vw,38px);font-weight:600;letter-spacing:-.018em;line-height:1.12}
  .sub{margin-top:.5vh;font-size:clamp(13px,1.3vw,19px);color:var(--ink2);line-height:1.42;max-width:96ch;min-height:2.85em}

  .stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;margin:.4vh 0}
  svg{display:block;width:100%;height:100%;max-height:100%}

  .band{fill:none;stroke-width:2.4}
  .rt{fill:none;stroke-width:3.2;stroke-linecap:round}
  .stand{fill:none;stroke-width:1.5;stroke-linecap:round;opacity:.72}
  .lab{font-family:var(--mono);font-size:12.5px}
  .yr{font-family:var(--mono);font-size:12.5px;fill:var(--ink3)}
  .pap{font-family:var(--mono);font-size:11px}
  .nv{font-family:var(--sans);font-size:14px;fill:var(--ink2)}
  .qk{font-family:var(--mono);font-size:13px}
  .q{font-family:var(--sans);font-size:15.5px;fill:var(--ink)}
  .qx{font-family:var(--sans);font-size:12.8px;fill:#7A7D74}
  #paneltbl{display:flex;flex-direction:column;justify-content:center;gap:10px;height:100%;
    padding:12px 22px;font-family:var(--sans);box-sizing:border-box;overflow:hidden}
  #paneltbl .prow{display:flex;align-items:flex-start;gap:12px;line-height:1.32}
  #paneltbl .pdot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:3px}
  #paneltbl .pk{flex:0 0 118px;font-family:var(--mono);font-size:12.5px}
  #paneltbl .pt{flex:1;font-size:13.5px;color:var(--ink)}
  #paneltbl .pt b{font-weight:600}
  #paneltbl .px{color:#7A7D74;font-size:12.5px}
  .nnum{font-family:var(--mono);font-size:13px;fill:var(--nodeink);pointer-events:none}
  .node{cursor:pointer}
  #a-soc,#a-bio,#e-soc,#e-bio,#g-models,#g-people,#g-hand,#g-past,#g-wait,#g-read,#g-panel,#g-nodes,
  #g-up,#g-down,#g-fan,#g-tgt,#g-fb,#g-stands,#g-out,#l-soc,#l-bio,.ev{transition:opacity .5s}

  .note{min-height:2.2em;font-size:clamp(12px,1.3vw,18px);line-height:1.35;color:var(--dead)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:.4vh;
       border-top:1px solid var(--rule);padding-top:.9vh}
  .acts{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
  button{font-family:var(--sans);font-size:clamp(11px,1vw,14px);color:var(--ink);background:#fff;
         border:1px solid var(--rule);border-radius:7px;padding:.48em 1em;cursor:pointer;transition:all .15s}
  button:hover{border-color:var(--ink3)}
  button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  button.rm.on{background:var(--dead);border-color:var(--dead);color:#fff}
  button.hide{visibility:hidden}
  .slider{display:flex;align-items:center;gap:11px}
  .slider label{font-family:var(--mono);font-size:clamp(10px,.95vw,13px);color:var(--ink2)}
  input[type=range]{width:clamp(140px,16vw,240px);accent-color:var(--route)}
  .nav{display:flex;align-items:center;gap:14px}
  .count{font-family:var(--mono);font-size:clamp(11px,1vw,14px);color:var(--ink3)}

  #notes{position:fixed;left:0;right:0;bottom:0;max-height:56vh;overflow:auto;
    background:#191C18;color:#E7E5DE;padding:22px 30px;font-size:15px;line-height:1.58;
    transform:translateY(102%);transition:transform .3s;z-index:40}
  #notes.show{transform:translateY(0)}
  #notes h3{font-family:var(--mono);font-size:12px;color:#93968D;font-weight:400;margin-bottom:10px;letter-spacing:.05em}
  #notes p{margin-bottom:9px;max-width:104ch}
  #notes .cite{font-family:var(--mono);font-size:12px;color:#93968D;line-height:1.5;margin-top:10px}

  /* ---------- text editor drawer ---------- */
  #ed{position:fixed;top:0;right:0;bottom:0;width:38vw;min-width:420px;background:#fff;
      border-left:1px solid var(--rule);box-shadow:-8px 0 30px rgba(0,0,0,.05);
      transform:translateX(102%);transition:transform .28s;z-index:60;display:flex;flex-direction:column}
  #ed.show{transform:translateX(0)}
  .edhead{padding:16px 20px;border-bottom:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .edhead b{font-size:15px;font-weight:600}
  .edhead .sm{font-family:var(--mono);font-size:11px;color:var(--ink3)}
  .edbody{flex:1;overflow:auto;padding:16px 20px 30px}
  .fld{margin-bottom:16px}
  .fld > label{display:block;font-family:var(--mono);font-size:11px;color:var(--ink3);margin-bottom:5px;letter-spacing:.03em}
  .fld input,.fld textarea{width:100%;font-family:var(--sans);font-size:14px;line-height:1.45;color:var(--ink);
    background:#FBFAF7;border:1px solid var(--rule);border-radius:6px;padding:8px 10px;resize:vertical}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--route);background:#fff}
  .fld textarea{min-height:58px}
  .fld textarea.big{min-height:150px;font-size:13px}
  .rowbox{border:1px solid var(--rule);border-radius:8px;padding:11px 12px;margin-bottom:10px;background:#FCFBF8}
  .rowbox .tagline{display:flex;align-items:center;gap:7px;margin-bottom:8px}
  .rowbox .swatch{width:10px;height:10px;border-radius:50%}
  .rowbox select{font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:5px;padding:3px 6px;background:#fff}
  .edfoot{padding:13px 20px;border-top:1px solid var(--rule);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .edfoot .sm{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-left:auto}
  .hint{font-family:var(--mono);font-size:11px;color:var(--ink3);line-height:1.5;margin-bottom:14px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

      "notes": "<p>Close on the diagram, not on a request.</p><p>Our concept note lists the functions of an A&amp;TP explicitly: a flexible boundary object for the disciplines in A, B and C to integrate their research; a tool to track progress towards the overarching cluster goals; a basis for science communication and policy-relevant outputs; a basis for further development of the SES concept; and a platform to organise interdisciplinary collaboration.</p><p>The Vollantrag states it directly: research in B is closely intertwined with and complements the natural science research in A, and is in close, mutual exchange with the interdisciplinary, implementation-related research in C.</p><p>The point of the whole talk is that this is not an aspiration written into a proposal. It is a diagram that only exists once each area has drawn its part of it.</p>",

function stands(){ $('g-stands').style.opacity=0; }
function panel(){
  const s=cur(), g=$('g-panel');
  let rows,nd;
  if(sel && i>=1){ rows=C.nodes[sel]; nd=sel; }
  else if(s.removals && rm){ const r=C.removals[rm];
    rows=[['red',r[0].toLowerCase(),r[1],''],null,null]; nd=null; }
  else { rows = s.panel || (s.node?C.nodes[s.node]:null); nd=s.node; }
  if(!rows){ g.style.opacity=0; $('leader').style.opacity=0; return; }
  g.style.opacity=1;
  $('paneltbl').innerHTML = rows.map(r=>{
    if(!r) return '';
    const c=COL[r[0]]||r[0];
    return '<div class="prow">'
      +'<span class="pdot" style="background:'+c+'"></span>'
      +'<span class="pk" style="color:'+c+'">'+esc(r[1])+'</span>'
      +'<span class="pt"><b>'+esc(r[2])+'</b>'
      +(r[3]?' <span class="px">'+esc(r[3])+'</span>':'')
      +'</span></div>';
  }).join('');
  const ld=$('leader');
  if(nd){ const xy=NODEXY[nd]; ld.style.opacity=1;
    ld.setAttribute('x1',xy[0]); ld.setAttribute('x2',xy[0]); ld.setAttribute('y1',xy[1]+21); ld.setAttribute('y2',322); }
  else ld.style.opacity=0;
}
function paint(){
  const s=cur(), corr=i>=1;
  $('p-blue').style.opacity=corr?1:0;
  $('g-nodes').style.opacity=corr?1:0;
  $('g-up').style.opacity=corr?1:0;
  $('g-down').style.opacity=corr?1:0;
  $('g-tgt').style.opacity=(i<=1)?1:0;
  $('g-fan').style.opacity=(i>=2)?1:0;
  $('g-out').style.opacity=((s.outputs||i===C.slides.length-1)&&!rm)?1:0;

  const hideBio=(rm==='bio'||rm==='sce'), hideSoc=(rm==='soc'||rm==='sce');
  const bioOn=(i>=4&&!hideBio), socOn=(i>=3&&!hideSoc);
  $('a-bio').style.opacity=bioOn?1:0; $('e-bio').style.opacity=bioOn?1:0; $('l-bio').style.opacity=bioOn?1:0;
  $('a-soc').style.opacity=socOn?1:0; $('e-soc').style.opacity=socOn?1:0; $('l-soc').style.opacity=socOn?1:0;
  $('g-models').style.opacity=(s.models&&bioOn)?1:0;

  const dD=(i>=4&&!hideBio), dU=(i>=4&&!hideSoc);
  const st=(p,dead)=>{const e=$(p);
    e.setAttribute('stroke',dead?'#B9B7AD':COL.route);
    e.setAttribute('stroke-width',dead?1.8:3.2);
    e.setAttribute('stroke-dasharray',dead?'3.5 4':'none');};
  st('p-up',dU); st('p-down',dD);
  $('x-up').style.opacity=dU?1:0; $('x-down').style.opacity=dD?1:0;

  $('g-wait').style.opacity=(corr&&!rm)?1:0;
  $('p-wait').setAttribute('stroke',COL.route);
  $('x-wait').style.opacity=0;
  if(rm==='eco'){ $('p-blue').setAttribute('stroke-dasharray','4 5'); $('p-blue').style.opacity=0.3; }
  else $('p-blue').setAttribute('stroke-dasharray','none');

  $('g-fb').style.opacity=(s.wall===2)?1:0;
  $('g-people').style.opacity=(s.people&&!rm)?1:0;
  $('g-hand').style.opacity=(s.people&&!rm)?1:0;
  $('g-past').style.opacity=(s.past)?1:0;
  $('x-past').style.opacity=s.past?1:0;

  [1,2,3].forEach(k=>$('r'+k).style.opacity=0);
  const active=(sel&&corr)?sel:s.node;
  if(active) $('r'+active).style.opacity=1;

  const rd=READ[i];
  $('g-read').style.opacity=rd?1:0;
  if(rd){ $('readline').setAttribute('x1',rd[0]); $('readline').setAttribute('x2',rd[0]);
    $('readlab').setAttribute('x',rd[0]+7);
    $('readlab').textContent = (typeof rd[1]==='number') ? C.labels.years[rd[1]] : rd[1]; }
  stands(); panel();
}
function acts(){
  const a=$('acts'); a.innerHTML=''; const s=cur();
  const mk=(x,f,on,cls)=>{const b=document.createElement('button');b.innerHTML=x;b.onclick=f;
    if(on)b.classList.add('on'); if(cls)b.classList.add(cls); a.appendChild(b);};
  if(i>=1&&i<=2){ a.innerHTML='<span class="count">'+C.lines.clickHint+'</span>'; return; }
  if(s.removals){
    Object.keys(C.removals).forEach(k=>
      mk(C.removals[k][0],()=>{rm=(rm===k?null:k);render();},rm===k,'rm'));
    if(rm) mk('Restore',()=>{rm=null;render();});
  }
}
function note(){
  const n=$('note'), s=cur(), L=C.lines;
  if(s.removals&&rm){ n.innerHTML=''; return; }
  if(s.removals){ n.innerHTML='<span style="color:#5C6058">'+L.removePrompt+'</span>'; return; }
  if(i===4){ n.innerHTML=L.excluded; return; }
  if(i===1){ n.innerHTML='<span style="color:'+COL.route+'">'+L.routes+'</span>'; return; }
  n.innerHTML='';
}
function eyebrow(){ return cur().eb||''; }
function render(){
  const s=cur();
  $('title').innerHTML=s.t; $('sub').innerHTML=s.s;
  $('eyebrow').textContent=eyebrow();
  [...dots.querySelectorAll('span')].forEach((d,k)=>d.classList.toggle('on',k===i));
  $('count').textContent=(i+1)+' / '+C.slides.length;
  $('prev').classList.toggle('hide',i===0);
  $('next').classList.toggle('hide',i===C.slides.length-1);
  $('nb').innerHTML=s.notes||'';
  const w=s.wall||0; wallTarget=w||1; tt=w?1:0;
  statics(); geometry(); paint(); acts(); note();
  if($('ed').classList.contains('show')) buildEd();
}
function pick(n){ if(i<1) return; sel=(sel===n?null:n); render(); }
function goto(j){ if(j===i) return; i=j; sel=null; rm=null; tt=0;
  if(C.slides[i].remove) rm=C.slides[i].remove;
  if(cutA) cutA(); cutA=tween(()=>cut,setCut,CUT[i],700);
  render();
}
function step(d){ goto(Math.max(0,Math.min(C.slides.length-1,i+d))); }

/* ---------- text editor ---------- */
function fld(label,val,oninput,big){
  const d=document.createElement('div'); d.className='fld';
  d.innerHTML='<label>'+label+'</label>';
  const el=document.createElement(big?'textarea':'textarea');
  el.value=val||''; if(big) el.className='big';
  el.oninput=e=>{oninput(e.target.value); render();};
  d.appendChild(el); return d;
}
function buildEd(){
  const b=$('edbody'); const scroll=b.scrollTop; b.innerHTML='';
  const s=cur();
  $('edslide').textContent='slide '+(i+1)+' / '+C.slides.length;
  const h=document.createElement('div'); h.className='hint';
  h.innerHTML='Type and the slide updates live. When you are done, press <b>Download edited deck</b> &mdash; you get a new HTML file with your words baked in.';
  b.appendChild(h);
  b.appendChild(fld('title', s.t, v=>s.t=v));
  b.appendChild(fld('subtitle', s.s, v=>s.s=v));

  const rows = s.panel || (s.node?C.nodes[s.node]:null);
  if(rows){
    const t=document.createElement('div'); t.className='fld';
    t.innerHTML='<label>'+(s.node?'panel (shared with decision point '+s.node+')':'panel')+'</label>';
    b.appendChild(t);
    rows.forEach((r,k)=>{
      const box=document.createElement('div'); box.className='rowbox';
      const tag=document.createElement('div'); tag.className='tagline';
      const sw=document.createElement('span'); sw.className='swatch'; sw.style.background=COL[r[0]]||r[0];
      const sel=document.createElement('select');
      ['bio','soc','eco','route','grey'].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;if(c===r[0])o.selected=true;sel.appendChild(o);});
      sel.onchange=e=>{r[0]=e.target.value; sw.style.background=COL[r[0]]; render();};
      const lab=document.createElement('input'); lab.value=r[1];
      lab.oninput=e=>{r[1]=e.target.value; render();};
      tag.appendChild(sw); tag.appendChild(sel); tag.appendChild(lab);
      box.appendChild(tag);
      box.appendChild(fld('statement', r[2], v=>r[2]=v));
      box.appendChild(fld('explanation', r[3], v=>r[3]=v));
      b.appendChild(box);
    });
  }
  if(s.removals){
    Object.keys(C.removals).forEach(k=>{
      const r=C.removals[k];
      const box=document.createElement('div'); box.className='rowbox';
      box.innerHTML='<div class="tagline"><span class="swatch" style="background:#A3453B"></span><span style="font-family:var(--mono);font-size:11px">'+k+'</span></div>';
      box.appendChild(fld('button label', r[0], v=>r[0]=v));
      box.appendChild(fld('what follows from the removal', r[1], v=>r[1]=v));
      b.appendChild(box);
    });
  }
  b.appendChild(fld('presenter notes (HTML allowed)', s.notes, v=>s.notes=v, true));
  b.scrollTop=scroll;
}
function toggleEd(){
  const e=$('ed'); e.classList.toggle('show');
  document.body.classList.toggle('editing', e.classList.contains('show'));
  if(e.classList.contains('show')) buildEd();
}
function exportHTML(){
  const json=JSON.stringify(C,null,2).replace(/<\//g,'<\\/');
  const out=PRISTINE.replace(/(<script type="application\/json" id="content">)[\s\S]*?(<\/script>)/,
    (m,a,z)=>a+'\n'+json+'\n'+z);
  const blob=new Blob([out],{type:'text/html'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='looking_from_the_end.html'; a.click();
  URL.revokeObjectURL(a.href);
}
function copyJSON(){ navigator.clipboard.writeText(JSON.stringify(C,null,2)); }

document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)) return;
  const k=e.key.toLowerCase();
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){step(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){step(-1);e.preventDefault();}
  else if(e.key==='Escape'){sel=null;render();}
  else if('123'.indexOf(k)>-1){pick(+k);}
  else if(k==='n'){$('notes').classList.toggle('show');}
  else if(k==='e'){toggleEd();}
  else if(k==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
setCut(740); render();
</script>

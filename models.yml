- id: orth
  layer: 1
  pi: Prof. Dr. René Orth
  pi_collaborators:
  - Prof. Dr. Teja Kattenborn
  - Dr. Pia Müller
  model_name: Forest Drought Response Functions
  title_short: Updating modelled forest response to atmospheric and soil dryness
  model_software: QUINCY
  objectives:
  - 'Obj. 1 (WP1): Derive functional relationships of vegetation response to VPD and soil moisture at grid-scale using observation-based
    datasets and plant trait maps'
  - 'Obj. 2 (WP1–WP2): Improve QUINCY by incorporating observation-derived vegetation–dryness relationships modulated by spatially

  model_name: C2 — Transdisciplinary Regionalised Scenarios for Novel SESs
  title_short: Transdisciplinary regionalised scenarios for novel forest SESs
  objectives:
  - Translate global frameworks (SSPs, RCPs, Nature's Futures Framework) into high-resolution, locally relevant inputs for
    FuFo study regions
  - Develop downscaled projections with explicit treatment of extreme events and compound droughts
  - Co-create socio-economic narratives and quantitative pathways with stakeholders and partner institutions
  short_description:
  - Produces the scenario infrastructure that all C3 models run on, translating global frameworks (SSPs, RCPs, NFF) into high-resolution,
    locally relevant inputs
  - 'Climate focus: downscaled projections with explicit treatment of extreme events and compound droughts'
  - 'Socio-economic focus: narratives and quantitative pathways co-created with stakeholders and partner institutions'
  - Products feed all C3 modelling groups and inform governance experimentation in C4
  modelling_approach: Scenario development / Statistical downscaling / Stakeholder co-design
  type: Scenario framework (C2) — feeds all C3 and C4 work
  language: []
  status: in_development
  scale: Regional — FuFo study regions (SW Germany) to national scale; global scenario frameworks as backbone
  inputs:
  - name: Global climate model outputs and regional downscaling (CMIP, CORDEX)
    format: NetCDF
    source: ESGF / Copernicus
  - name: Stakeholder input from partner institutions
    format: Qualitative / structured parameters
    source: SES-CaseLab / ForstBW / FVA
  outputs:
  - name: Downscaled hydro-climatic projections and extreme event storylines
    format: NetCDF / structured parameters
    consumers:
    - iLAND
    - RoGeR
    - Brown
    - Hanewinkel
    - Stritih
  - name: Socio-economic scenarios and co-created regional storylines
    format: Structured parameters / reports
    consumers:
    - All C3 groups
    - C4
  hire:
    name: Dr. Christopher Jung (PostDoc)
    start: TBD
  notes: 'C2 PIs: Stahl (hydro-climatic scenarios and extreme events), Schindler, Christen, Orth. Hanewinkel co-leads C2 at
    cluster-speaker level and contributes socio-economic scenarios, but is not a PI on the C2 project proposal. HyClimScenarios
    (Jung/Schindler) is the primary C2 computational output feeding C3.'
  area_of_application: Climate and socio-economic scenarios
  topic: Transdisciplinary Regionalised Scenarios
  cluster: conceptual
  hiring_status: ''
- id: jung_schindler
  layer: 1
  pi: Prof. Dr. Kerstin Stahl · Prof. Dr. Dirk Schindler · Prof. Dr. Andreas Christen · Prof. Dr. René Orth
  model_name: HyClimScenarios
  title_short: High-resolution climate scenario downscaling for the FuFo domain
  model_software: Statistical downscaling with tree-ensemble methods; ERA5-Land / CORDEX / CMIP6
  objectives:
  - Prepare regionalized reanalysis and future climate scenario data to support all cluster modelling activities
  - Develop novel approaches to generate specific scenarios for forest-relevant aspects of the water balance, including extreme
    events
  - Produce 100 m × 100 m meteorological forcing fields (T, precip, VPD, wind, radiation, derived indices) under historical
    conditions and CMIP6 warming levels
  short_description:
  - Downscales ERA5-Land reanalysis and CMIP6 projections from ~10–120 km to 100 m × 100 m grid across the study regions
  - Uses tree-ensemble ML for bias correction and statistical downscaling, covering historical conditions and future climate
    under multiple CMIP6 warming levels
  - Develops novel approaches for forest-relevant water balance aspects, including extreme events (in collaboration with Stahl)
  type: Statistical downscaling / Climate scenario modelling
  modelling_approach: Statistical downscaling / Machine learning (tree-ensemble)
  language:
  - Python
  - R
  status: in_development
  scale: 100 m x 100 m grid, regional to SW Germany
  inputs:
  - name: ERA5-Land gridded reanalysis (0.10° × 0.10°, hourly)
    source: ECMWF (open access)
  - name: Global Historical Climatology Network — >2000 measurement sites in Central Europe
    source: NOAA GHCN (open access)
  - name: CMIP6 global climate model outputs under various SSP/RCP scenarios
    source: ESGF (open access)
  - name: Digital elevation model predictors
    source: National surveys
  - name: Land use model predictors
    source: Copernicus / national surveys
  outputs:
  - name: 'Downscaled hourly/daily fields at 100 m × 100 m: air temperature, precipitation, dew point, wind speed, solar radiation,
      vapour pressure deficit, derived climate indices'
  - name: Climate projections under CMIP6 global warming levels
  method: Tree-ensemble methods for residual-based bias correction of hourly reanalysis and daily climate model products.
    Statistical downscaling from ~10-120 km to 100 m x 100 m.
  hire:
    name: TBD
    start: TBD
  area_of_application: Meteorology, climatology
  topic: Climate analysis and modelling
  methods: Modelling
  cluster: climate_hydrology
  hiring_status: Dr. Christopher Jung (PostDoc)

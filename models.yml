- id: christen_ml
  layer: 1
  pi: Prof. Dr. Andreas Christen
  pi_collaborators:
  - Prof. Dr. René Orth
  model_name: ML Forest Climate Projections — A1 Integration (from 2028)
  title_short: ML-based in-canopy microclimate projection (from 2028)
  model_software: ML hybrid physical-statistical downscaling (Python)
  objectives:
  - 'Goal 1 (from 2028): Extend sensor network ML hindcast with forest physiology data from QUINCY to improve within-canopy
    predictions'
  - 'Goal 2: Project in-canopy microclimates across FuFo domain under future climate scenarios'
  - 'Goal 3: Quantify forest microclimate buffering — how much does the canopy shield trees from extreme heat and drought?'
  short_description:
  - Extends the sensor network work (A1 WP1) by incorporating forest biology — how the canopy regulates temperature and humidity
    through leaf area, stomatal opening, and photosynthesis
  - Combines sensor network data (Christen A1), climate projections (Jung/Schindler C2), and QUINCY canopy physiology (Orth)
    to project in-canopy conditions under future climate
  - Enables understanding of whether forests can buffer themselves against climate extremes
  - Starts 2028, building on sensor network measurements and C2 climate projections

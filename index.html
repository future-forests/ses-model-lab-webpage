<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SES-ModelLab · Future Forests</title>
<meta name="description" content="Coordination and support of modeling activities in the Future Forests Excellence Cluster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---- PALETTE: edit these to recolour the whole page ---- */
    --bg: #eaf1f5;              /* page background — cool blue-grey */
    --surface: #ffffff;          /* card background */
    --surface-warm: #dbe9f2;     /* accent card — soft blue */
    --border: #c3d8e4;           /* default border */
    --border-strong: #94b9cd;    /* border on hover */
    --border-warm: #a9c8dc;      /* accent card border */
    --text: #12292f;             /* body text — deep blue-black */
    --text-mute: #3d6472;        /* secondary text — slate blue */
    --text-soft: #416b76;        /* quiet labels */
    --brand-green: #0d7168;      /* teal — links, icons, brand mark */
    --brand-navy: #164e63;       /* headings — deep ocean blue */
    --accent-blue: #1b6893;      /* section numbers, eyebrows — clear blue */
    --link: #0d7168;
    --wrap: 900px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 1.75rem; }
  a { color: var(--link); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s ease; }
  a:hover { border-bottom-color: var(--link); }
  a:focus-visible { outline: 2px solid var(--brand-green); outline-offset: 3px; border-radius: 2px; }

  /* Top brand line */
  .brand {
    padding: 1.5rem 0 0;
    background: linear-gradient(105deg, #d3ebe6 0%, #d6e6f2 100%);
  }
  .brand .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand-lockup {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .brand-lockup img {
    height: 42px;
    width: auto;
    display: block;
  }
  .brand-right { display: flex; align-items: center; gap: 1rem; }
  .brand-right img { height: 30px; width: auto; display: block; }
  @media (max-width: 620px) {
    .brand .wrap { gap: 0.75rem; }
    .brand-lockup img { height: 34px; }
    .brand-right img { height: 24px; }
    .brand-context { display: none; }
  }
  .brand a { border: 0; }
  .brand-mark {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brand-green);
    font-weight: 500;
  }
  .brand-context {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-mute);
  }

  /* Hero */
  .hero {
    padding: 6rem 0 5.5rem;
    background: linear-gradient(160deg, #d3ebe6 0%, #d6e6f2 38%, var(--bg) 78%);
  }
  .hero-eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.8rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brand-green);
    font-weight: 500;
    margin: 0 0 1.5rem;
  }
  .hero h1 {
    font-size: clamp(2.25rem, 5.5vw, 3.75rem);
    line-height: 1.08;
    font-weight: 600;
    color: var(--brand-navy);
    margin: 0 0 1.25rem;
    max-width: 20ch;
    letter-spacing: -0.02em;
  }
  .hero-lede {
    font-size: 1.15rem;
    color: var(--text-mute);
    margin: 0;
    max-width: 42ch;
    line-height: 1.5;
  }

  /* Sections */
  .block { padding: 4rem 0 5rem; }
  .block + .block { border-top: 1px solid var(--border); }
  .section-head { margin-bottom: 2.5rem; }
  .section-num {
    display: block;
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 1.6rem;
    line-height: 1;
    color: var(--accent-blue);
    opacity: 0.55;
    font-weight: 400;
    margin-bottom: 0.7rem;
    letter-spacing: 0.02em;
  }
  .section-eyebrow {
    display: inline-block;
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-blue);
    font-weight: 500;
    margin-bottom: 0.7rem;
  }
  .block h2 {
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    line-height: 1.15;
    color: var(--brand-navy);
    margin: 0 0 0.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .block .lede {
    color: var(--text-mute);
    max-width: 60ch;
    margin: 0;
    font-size: 1.05rem;
  }

  /* Card grid */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }
  @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.6rem 1.6rem 1.7rem;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .card.warm { background: var(--surface-warm); border-color: var(--border-warm); }
  .card.warm:hover { border-color: #7ba9c6; }

  .card .icon {
    color: var(--brand-green);
    margin-bottom: 0.35rem;
  }
  .card.warm .icon { color: var(--accent-blue); }
  .card .icon svg { width: 1.5rem; height: 1.5rem; display: block; }
  .card .card-logo {
    height: 58px;
    width: auto;
    align-self: flex-start;
    flex: none;
    display: block;
    margin: 0 0 0.5rem -2px;
  }

  .card .stage {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-blue);
    font-weight: 500;
    margin: 0.1rem 0 -0.2rem;
  }
  .card h3 {
    margin: 0;
    font-size: 1.2rem;
    color: var(--brand-navy);
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .card .desc {
    color: var(--text);
    margin: 0;
    font-size: 0.97rem;
  }
  .card .meta {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-navy);
    font-weight: 500;
    margin: 0.2rem 0 0;
  }
  .card.warm .meta { color: var(--accent-blue); }
  .card .venue { color: var(--text-mute); font-size: 0.94rem; margin: 0; }
  .card .mode { color: var(--text-soft); font-size: 0.88rem; margin: 0; font-style: italic; }

  /* Link cards (registries) */
  .card.link-card {
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .card.link-card:hover {
    border-color: var(--border-strong);
    border-bottom-color: var(--border-strong);
  }
  .card.link-card h3 { color: var(--brand-navy); }
  .card.link-card .icon { color: var(--accent-blue); }
  .card.link-card .go {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--brand-green);
    margin: 0.6rem 0 0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .card.link-card:hover .go { gap: 0.7rem; }
  .card.link-card .go .arr { transition: none; }
  .section-note {
    color: var(--text-mute);
    font-size: 0.94rem;
    margin: 1.25rem 0 0;
    max-width: 62ch;
  }

  /* Prose within Cooperation groups */
  .prose p { margin: 0.85rem 0; max-width: 62ch; color: var(--text); }

  /* Info-card (Cooperation groups highlight) */
  .info-card {
    background: #dcece9;
    border: 1px solid #a8ccc5;
    border-radius: 8px;
    padding: 1.75rem 2rem 1.85rem;
    margin: 2rem 0;
    max-width: 720px;
  }
  .info-card p.hint { margin: 1rem 0 0.6rem; color: var(--text); }
  .info-list {
    margin: 0.25rem 0 0;
    padding-left: 1.2rem;
    color: var(--text);
  }
  .info-list li { margin: 0.35rem 0; }

  /* CTA button */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.65rem;
    background: var(--brand-navy);
    color: #fff;
    padding: 0.8rem 1.25rem;
    border-radius: 5px;
    font-weight: 500;
    font-size: 0.98rem;
    border: 0;
    transition: background 0.15s ease;
  }
  .cta:hover { background: #0e3849; border-color: transparent; }
  .cta .arr {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    opacity: 0.75;
  }

  /* Contact */
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    margin-top: 0.5rem;
    align-items: start;
  }
  @media (max-width: 720px) { .contact-grid { grid-template-columns: 1fr; gap: 2rem; } }
  .contact-note { color: var(--text-mute); font-size: 0.92rem; margin: 0.9rem 0 0; line-height: 1.5; }
  .contact-list dl { margin: 0; }
  .contact-list dt {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-soft);
    font-weight: 500;
    margin-top: 1.25rem;
  }
  .contact-list dt:first-of-type { margin-top: 0; }
  .contact-list dd {
    margin: 0.4rem 0 0;
    font-size: 1rem;
    color: var(--text);
    line-height: 1.5;
  }
  .contact-list dd + dd { margin-top: 0.2rem; }

  /* Footer */
  footer.site {
    border-top: 1px solid var(--border);
    padding: 2rem 0 2.5rem;
    margin-top: 2rem;
    color: var(--text-mute);
    font-size: 0.85rem;
  }
  footer.site .wrap {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  footer.site a { color: var(--text-mute); border-bottom-color: var(--border-strong); }
</style>
</head>

<script>

      if (k === 'class') n.className = v;
      else if (k === 'html') n.innerHTML = v;
      else n.setAttribute(k, v);
    }
    for (const c of [].concat(children)) {
      if (c == null) continue;
      n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return n;
  };
  const wrap = (children) => el('div', { class: 'wrap' }, children);

  // --- icons (simple line SVGs) ---

    coffee: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',

        const card = el('a', { class: 'card link-card', href: c.url });
        if (c.icon) card.appendChild(iconEl(c.icon));
        card.appendChild(el('h3', {}, c.title));
        if (c.desc) card.appendChild(el('p', { class: 'desc' }, c.desc));
        const go = el('p', { class: 'go' });
        go.append(c.action || 'Open', el('span', { class: 'arr' }, '→'));
        card.appendChild(go);
        grid.appendChild(card);
      });
      body = el('div', {}, [
        grid,
        sec.note ? el('p', { class: 'section-note' }, sec.note) : null
      ]);
    } else if (sec.type === 'cooperation') {
      body = el('div', {}, [
        el('div', { class: 'prose' }, el('p', {}, sec.intro)),
        (function () {
          const card = el('div', { class: 'info-card' });
          const cta = el('a', { class: 'cta', href: sec.cta.url });
          cta.append(sec.cta.text + ' ', el('span', { class: 'arr' }, '↗'));
          card.appendChild(cta);
          card.appendChild(el('p', { class: 'hint' }, sec.hint));
          const ul = el('ul', { class: 'info-list' });
          sec.instructions.forEach(t => ul.appendChild(el('li', {}, t)));
          card.appendChild(ul);
          return card;
        })(),
        el('div', { class: 'prose' }, sec.closing.map(t => el('p', {}, t)))
      ]);
    } else if (sec.type === 'contact') {
      const left = el('div', {}, [
        (function () {
          const cta = el('a', { class: 'cta', href: sec.matrix.url });
          cta.append(sec.matrix.text + ' ', el('span', { class: 'arr' }, '↗'));
          return cta;
        })(),
        el('p', { class: 'contact-note' }, sec.matrix.note)
      ]);
      const dl = el('dl');
      dl.appendChild(el('dt', {}, 'Email'));
      sec.emails.forEach(e => {
        const dd = el('dd');
        dd.appendChild(el('a', { href: 'mailto:' + e }, e));
        dl.appendChild(dd);
      });
      dl.appendChild(el('dt', {}, 'Address'));
      sec.addresses.forEach(a => dl.appendChild(el('dd', {}, a)));
      const right = el('div', { class: 'contact-list' }, dl);
      body = el('div', { class: 'contact-grid' }, [left, right]);
    }

    const section = el('section', { class: 'block' }, [wrap([head, body])]);
    app.appendChild(section);
  });

  // --- footer ---
  const fWrap = document.querySelector('footer.site .wrap');
  fWrap.appendChild(el('span', {}, data.footer.left));
  const right = el('span', {}, data.footer.right.label + ': ');
  right.appendChild(el('a', { href: data.footer.right.url }, data.footer.right.text));
  fWrap.appendChild(right);
})();
</script>

</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Forests SES Model Lab</title>
<meta name="description" content="Coordination and support of modeling activities in the Future Forests Excellence Cluster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* ---- PALETTE: edit these to recolour the whole page ---- */
    --bg: #eaf1f5;              /* page background — cool blue-grey */
    --surface: #ffffff;          /* card background */
    --surface-warm: #dbe9f2;     /* accent card — soft blue */
    --border: #c3d8e4;           /* default border */
    --border-strong: #94b9cd;    /* border on hover */
    --border-warm: #a9c8dc;      /* accent card border */
    --text: #12292f;             /* body text — deep blue-black */
    --text-mute: #3d6472;        /* secondary text — slate blue */
    --text-soft: #416b76;        /* quiet labels */
    --brand-green: #0d7168;      /* teal — links, icons, brand mark */
    --brand-navy: #164e63;       /* headings — deep ocean blue */
    --accent-blue: #1b6893;      /* section numbers, eyebrows — clear blue */
    --link: #0d7168;
    --wrap: 900px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .wrap { max-width: var(--wrap); margin: 0 auto; padding: 0 1.75rem; }
  a { color: var(--link); text-decoration: none; border-bottom: 1px solid transparent; transition: border-color 0.15s ease; }
  a:hover { border-bottom-color: var(--link); }
  a:focus-visible { outline: 2px solid var(--brand-green); outline-offset: 3px; border-radius: 2px; }

  /* Top brand line */
  .brand {
    padding: 4.5rem 0 0;
    background: linear-gradient(105deg, #d3ebe6 0%, #d6e6f2 100%);
  }
  .brand .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .brand-lockup {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .brand-lockup img {
    height: 42px;
    width: auto;
    display: block;
  }
  .brand-right { display: flex; align-items: center; gap: 1rem; }
  .brand-right img { height: 30px; width: auto; display: block; }
  @media (max-width: 620px) {
    .brand { padding-top: 3.9rem; }
    .brand .wrap { gap: 0.75rem; }
    .brand-lockup img { height: 34px; }
    .brand-right img { height: 24px; }
    .brand-context { display: none; }
  }
  .brand a { border: 0; }
  .brand-mark {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brand-green);
    font-weight: 500;
  }
  .brand-context {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-mute);
  }

  /* Hero */
  .hero {
    padding: 6rem 0 5.5rem;
    background: linear-gradient(160deg, #d3ebe6 0%, #d6e6f2 38%, var(--bg) 78%);
  }
  .hero-eyebrow {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.8rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brand-green);
    font-weight: 500;
    margin: 0 0 1.5rem;
  }
  .hero h1 {
    font-size: clamp(2.25rem, 5.5vw, 3.75rem);
    line-height: 1.08;
    font-weight: 600;
    color: var(--brand-navy);
    margin: 0 0 1.25rem;
    max-width: 20ch;
    letter-spacing: -0.02em;
  }
  .hero-lede {
    font-size: 1.15rem;
    color: var(--text-mute);
    margin: 0;
    max-width: 42ch;
    line-height: 1.5;
  }
  .hero-role {
    margin: 2.75rem 0 0;
    max-width: 62ch;
  }
  .hero-role h2 {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-blue);
    font-weight: 500;
    margin: 0 0 1.1rem;
  }
  .hero-role ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem 2rem;
  }
  @media (max-width: 720px) { .hero-role ul { grid-template-columns: 1fr; } }
  .hero-role li {
    margin: 0;
    padding-left: 0.9rem;
    border-left: 2px solid var(--brand-green);
    font-size: 1rem;
    line-height: 1.5;
    color: var(--text);
  }
  .hero-role .role-label {
    font-weight: 600;
    color: var(--brand-navy);
  }

  /* Sections */
  .block { padding: 4rem 0 5rem; }
  .block + .block { border-top: 1px solid var(--border); }
  .section-head { margin-bottom: 2.5rem; }
  .section-num {
    display: block;
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 1.6rem;
    line-height: 1;
    color: var(--accent-blue);
    opacity: 0.55;
    font-weight: 400;
    margin-bottom: 0.7rem;
    letter-spacing: 0.02em;
  }
  .section-eyebrow {
    display: inline-block;
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-blue);
    font-weight: 500;
    margin-bottom: 0.7rem;
  }
  .block h2 {
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    line-height: 1.15;
    color: var(--brand-navy);
    margin: 0 0 0.75rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .block .lede {
    color: var(--text-mute);
    max-width: 60ch;
    margin: 0;
    font-size: 1.05rem;
  }

  /* Card grid */
  .cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }
  @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 1.6rem 1.6rem 1.7rem;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .card.warm { background: var(--surface-warm); border-color: var(--border-warm); }
  .card.warm:hover { border-color: #7ba9c6; }

  .card .icon {
    color: var(--brand-green);
    margin-bottom: 0.35rem;
  }
  .card.warm .icon { color: var(--accent-blue); }
  .card .icon svg { width: 1.5rem; height: 1.5rem; display: block; }
  .card .card-logo {
    height: 58px;
    width: auto;
    align-self: flex-start;
    flex: none;
    display: block;
    margin: 0 0 0.5rem -2px;
  }

  .card .stage {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-blue);
    font-weight: 500;
    margin: 0.1rem 0 -0.2rem;
  }
  .card h3 {
    margin: 0;
    font-size: 1.2rem;
    color: var(--brand-navy);
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .card .desc {
    color: var(--text);
    margin: 0;
    font-size: 0.97rem;
  }
  .card .meta {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-navy);
    font-weight: 500;
    margin: 0.2rem 0 0;
  }
  .card.warm .meta { color: var(--accent-blue); }
  .card .venue { color: var(--text-mute); font-size: 0.94rem; margin: 0; }
  .card .mode { color: var(--text-soft); font-size: 0.88rem; margin: 0; font-style: italic; }
  .card .next {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--brand-green);
    font-weight: 500;
    margin: 0.1rem 0 0;
  }

  /* Session update block (recap of the last meeting) */
  .card .update {
    margin: 0.85rem 0 0;
    padding: 0.9rem 1rem 1rem;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px;
  }
  .card.warm .update { background: rgba(255,255,255,0.45); border-color: var(--border-warm); }
  .card .update .update-label {
    display: block;
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent-blue);
    font-weight: 500;
    margin: 0 0 0.4rem;
  }
  .card .update h4 {
    margin: 0 0 0.45rem;
    font-size: 1rem;
    line-height: 1.3;
    color: var(--brand-navy);
    font-weight: 600;
  }
  .card .update p {
    margin: 0.5rem 0 0;
    font-size: 0.92rem;
    line-height: 1.5;
    color: var(--text);
  }
  .card .update p:first-of-type { margin-top: 0; }

  /* Link cards (registries) */
  .card.link-card {
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .card.link-card:hover {
    border-color: var(--border-strong);
    border-bottom-color: var(--border-strong);
  }
  .card.link-card h3 { color: var(--brand-navy); }
  .card.link-card .icon { color: var(--accent-blue); }
  .card.link-card .go {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--brand-green);
    margin: 0.6rem 0 0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .card.link-card:hover .go { gap: 0.7rem; }
  .card.link-card .go .arr { transition: none; }
  .section-note {
    color: var(--text-mute);
    font-size: 0.94rem;
    margin: 1.25rem 0 0;
    max-width: 62ch;
  }

  /* Zoom link inside session cards */
  .card .zoom-link {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--brand-green);
    margin: 0.55rem 0 0;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    align-self: flex-start;
    border-bottom: 1px solid transparent;
  }
  .card .zoom-link:hover { border-bottom-color: var(--brand-green); gap: 0.6rem; }

  /* Next-session note, sits under the Zoom link */
  .card .upcoming {
    margin: 0.9rem 0 0;
    font-size: 0.9rem;
    line-height: 1.55;
    color: var(--text);
    border-left: 2px solid var(--brand-green);
    padding-left: 0.7rem;
  }

  /* Preview cards — linked page with a miniature screenshot */
  .preview-card {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 1.75rem;
    align-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.15rem;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .preview-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .preview-shot {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
  }
  .preview-body {
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    padding: 0.3rem 0.6rem 0.3rem 0;
  }
  .preview-body h3 {
    margin: 0;
    font-size: 1.2rem;
    color: var(--brand-navy);
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .preview-body .desc { color: var(--text); margin: 0; font-size: 0.97rem; }
  .preview-body .go {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--brand-green);
    margin: 0.5rem 0 0;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .preview-card:hover .go { gap: 0.7rem; }
  @media (max-width: 720px) {
    .preview-card { grid-template-columns: 1fr; gap: 1.1rem; }
    .preview-body { padding: 0 0.35rem 0.4rem; }
  }

  /* Sub-block within a section (e.g. AGM breakout rooms) */
  .subblock {
    margin-top: 3.25rem;
    padding-top: 2.5rem;
    border-top: 1px solid var(--border);
  }
  .subblock h3 {
    font-size: clamp(1.25rem, 2.2vw, 1.5rem);
    line-height: 1.2;
    color: var(--brand-navy);
    margin: 0 0 0.9rem;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .duo-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
    margin-top: 1.9rem;
  }
  @media (max-width: 720px) { .duo-grid { grid-template-columns: 1fr; } }
  .duo-card {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1.15rem;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .duo-card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  .duo-shot {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: #fff;
  }
  .duo-card h4 {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--brand-navy);
    letter-spacing: -0.005em;
    padding: 0 0.35rem;
  }
  .duo-card .go {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: var(--brand-green);
    margin: auto 0 0.25rem;
    padding: 0 0.35rem;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .duo-card:hover .go { gap: 0.7rem; }

  /* Prose within Cooperation groups */
  .prose p { margin: 0.85rem 0; max-width: 62ch; color: var(--text); }

  /* Info-card (Cooperation groups highlight) */
  .info-card {
    background: #dcece9;
    border: 1px solid #a8ccc5;
    border-radius: 8px;
    padding: 1.75rem 2rem 1.85rem;
    margin: 2rem 0;
    max-width: 720px;
  }
  .info-card p.hint { margin: 1rem 0 0.6rem; color: var(--text); }
  .info-list {
    margin: 0.25rem 0 0;
    padding-left: 1.2rem;
    color: var(--text);
  }
  .info-list li { margin: 0.35rem 0; }

  /* Cooperation groups list */
  .group-list {
    margin: 0.25rem 0 0;
    padding-left: 1.2rem;
    color: var(--text);
    max-width: 62ch;
  }
  .group-list li { margin: 0.8rem 0; }
  .group-list .group-name { font-weight: 600; color: var(--brand-navy); }
  .group-list .group-links { display: block; margin-top: 0.2rem; font-size: 0.94rem; }
  .group-list .group-links a + a { margin-left: 0.9rem; }
  .group-list .group-panel { margin: 0.75rem 0 0; }

  /* CTA button */
  .cta {
    display: inline-flex;
    align-items: center;
    gap: 0.65rem;
    background: var(--brand-navy);
    color: #fff;
    padding: 0.8rem 1.25rem;
    border-radius: 5px;
    font-weight: 500;
    font-size: 0.98rem;
    border: 0;
    transition: background 0.15s ease;
  }
  .cta:hover { background: #0e3849; border-color: transparent; }
  .cta .arr {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    opacity: 0.75;
  }

  /* Course */
  .info-card p.pdf-link { margin: 1rem 0 0; color: var(--text); font-size: 0.95rem; }
  .info-card p.pdf-link .arr {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    opacity: 0.7;
  }
  .calendar { margin: 2.75rem 0 0; }
  .calendar h3 {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent-blue);
    font-weight: 500;
    margin: 0 0 0.85rem;
  }
  .calendar img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .calendar figcaption {
    margin: 0.8rem 0 0;
    color: var(--text-mute);
    font-size: 0.9rem;
    line-height: 1.5;
    max-width: 62ch;
  }

  /* Contact */
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2.5rem;
    margin-top: 0.5rem;
    align-items: start;
  }
  @media (max-width: 720px) { .contact-grid { grid-template-columns: 1fr; gap: 2rem; } }
  .contact-note { color: var(--text-mute); font-size: 0.92rem; margin: 0.9rem 0 0; line-height: 1.5; }
  .contact-list dl { margin: 0; }
  .contact-list dt {
    font-family: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    font-size: 0.7rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-soft);
    font-weight: 500;
    margin-top: 1.25rem;
  }
  .contact-list dt:first-of-type { margin-top: 0; }
  .contact-list dd {
    margin: 0.4rem 0 0;
    font-size: 1rem;
    color: var(--text);
    line-height: 1.5;
  }
  .contact-list dd + dd { margin-top: 0.2rem; }

  /* Footer */
  footer.site {
    border-top: 1px solid var(--border);
    padding: 2rem 0 2.5rem;
    margin-top: 2rem;
    color: var(--text-mute);
    font-size: 0.85rem;
  }
  footer.site .wrap {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  footer.site a { color: var(--text-mute); border-bottom-color: var(--border-strong); }

  /* Floating section nav — pinned to the top of the window at all times */
  .floatnav {
    position: fixed;
    top: 0.9rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    max-width: calc(100vw - 1.5rem);
    background: rgba(255, 255, 255, 0.95);
    -webkit-backdrop-filter: saturate(180%) blur(14px);
    backdrop-filter: saturate(180%) blur(14px);
    border: 1px solid var(--border-strong);
    border-radius: 999px;
    box-shadow: 0 8px 26px rgba(18, 41, 47, 0.18);
    padding: 0.35rem;
  }
  .floatnav ul {
    display: flex;
    align-items: center;
    gap: 0.15rem;
    list-style: none;
    margin: 0;
    padding: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .floatnav ul::-webkit-scrollbar { display: none; }
  .floatnav a {
    display: block;
    white-space: nowrap;
    padding: 0.4rem 0.75rem;
    border-radius: 999px;
    border-bottom: 0;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--brand-navy);
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .floatnav a:hover { background: var(--surface-warm); color: var(--brand-navy); }
  .floatnav a.is-active {
    background: var(--brand-navy);
    color: #fff;
  }
  .floatnav a.is-active:hover { background: var(--brand-navy); color: #fff; }
  .floatnav a:focus-visible { outline: 2px solid var(--brand-green); outline-offset: 2px; }

  /* Anchor targets clear the floating bar */
  .block { scroll-margin-top: 5rem; }

  @media (max-width: 720px) {
    .floatnav { top: 0.5rem; border-radius: 1rem; }
    .floatnav a { padding: 0.35rem 0.6rem; font-size: 0.8rem; }
  }


</style>
</head>
<body>

  To change wording, dates, cards, emails: edit the values, save, reload.
  Add a new card by appending to a "cards" array. Delete by removing.
  Do NOT remove id="content" from the <script> tag or the page will not render.

<script type="application/json" id="content">
{
  "brand": {

            "body": [
              "Over the past two Hands on Science sessions we reproduced the analysis of Carle et al. (2025), Nature (https://www.nature.com/articles/s41586-025-09497-8), from the authors' own published code, and raised four points \u2014 small but important errors \u2014 with the corresponding author, Hannah Carle.",

    return n;
  };
  const wrap = (children) => el('div', { class: 'wrap' }, children);
  const secId = (sec) => 'sec-' + String(sec.num).replace(/[^a-z0-9]/gi, '');

  // --- icons (simple line SVGs) ---
  const ICONS = {
    coffee: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8h1a4 4 0 0 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',
    beaker: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v6L4 20a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1L15 9V3"/><line x1="7" y1="3" x2="17" y2="3"/><line x1="6.5" y1="14" x2="17.5" y2="14"/></svg>',
    terminal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>',
    wrench: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>',
    layers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>',
    network: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><line x1="10.6" y1="7.1" x2="6.4" y2="15.9"/><line x1="13.4" y1="7.1" x2="17.6" y2="15.9"/><line x1="7.5" y1="18" x2="16.5" y2="18"/></svg>'
  };
  const iconEl = (name) => {
    const span = el('span', { class: 'icon', 'aria-hidden': 'true' });
    span.innerHTML = ICONS[name] || '';
    return span;
  };

  // --- brand ---
  const brandWrap = document.querySelector('.brand .wrap');
  const lockup = el('div', { class: 'brand-lockup' });
  if (data.brand.logo) {
    lockup.appendChild(el('img', { src: data.brand.logo, alt: 'SES-ModelLab logo' }));
  }
  lockup.appendChild(el('span', { class: 'brand-mark' }, data.brand.mark));
  brandWrap.appendChild(lockup);

  const brandRight = el('div', { class: 'brand-right' });
  brandRight.appendChild(el('span', { class: 'brand-context' }, data.brand.context));
  if (data.brand.fufoLogo) {
    brandRight.appendChild(el('img', { src: data.brand.fufoLogo, alt: 'Future Forests logo' }));
  }
  brandWrap.appendChild(brandRight);

  // --- hero ---
  const app = document.getElementById('app');
  const hero = el('section', { class: 'hero' }, [
    wrap([
      el('p', { class: 'hero-eyebrow' }, data.hero.eyebrow),
      el('h1', {}, data.hero.headline),
      data.hero.lede ? el('p', { class: 'hero-lede' }, data.hero.lede) : null,
      data.hero.role ? (function () {
        const ul = el('ul');
        (data.hero.role.items || []).forEach(item => {
          const li = el('li', {}, [el('span', { class: 'role-label' }, item.label)]);
          if (item.text) li.append(' \u2014 ' + item.text);
          ul.appendChild(li);
        });
        return el('div', { class: 'hero-role' }, [
          data.hero.role.title ? el('h2', {}, data.hero.role.title) : null,
          ul
        ]);
      })() : null
    ])
  ]);
  app.appendChild(hero);

  // --- sections ---
  data.sections.forEach(sec => {
    const head = el('div', { class: 'section-head' }, [
      el('span', { class: 'section-num' }, sec.num),
      el('span', { class: 'section-eyebrow' }, sec.eyebrow),
      el('h2', {}, sec.title),
      sec.lede ? el('p', { class: 'lede' }, sec.lede) : null
    ]);

    let body;

    if (sec.type === 'cards') {
      const grid = el('div', { class: 'cards' });
      sec.cards.forEach(c => {
        const card = el('div', { class: 'card' + (c.warm ? ' warm' : '') });
        if (c.logo) card.appendChild(el('img', { class: 'card-logo', src: c.logo, alt: '' }));
        else if (c.icon) card.appendChild(iconEl(c.icon));
        if (c.stage) card.appendChild(el('p', { class: 'stage' }, c.stage));
        card.appendChild(el('h3', {}, c.title));
        if (c.desc) card.appendChild(el('p', { class: 'desc' }, c.desc));
        if (c.meta) card.appendChild(el('p', { class: 'meta' }, c.meta));
        if (c.next) card.appendChild(el('p', { class: 'next' }, c.next));
        if (c.venue) card.appendChild(el('p', { class: 'venue' }, c.venue));
        if (c.mode) card.appendChild(el('p', { class: 'mode' }, c.mode));
        if (c.zoom) {
          const z = el('a', { class: 'zoom-link', href: c.zoom, target: '_blank', rel: 'noopener' });
          z.append('Join on Zoom ', el('span', { class: 'arr' }, '↗'));
          card.appendChild(z);
        }
        if (c.upcoming) card.appendChild(el('p', { class: 'upcoming' }, c.upcoming));
        if (c.update) {
          const box = el('div', { class: 'update' });
          if (c.update.label) box.appendChild(el('span', { class: 'update-label' }, c.update.label));
          if (c.update.title) box.appendChild(el('h4', {}, c.update.title));
          (c.update.body || []).forEach(t => box.appendChild(el('p', {}, t)));
          card.appendChild(box);
        }
        grid.appendChild(card);
      });
      body = grid;
    } else if (sec.type === 'course') {
      const card = el('div', { class: 'info-card' });
      if (sec.cta) {
        const cta = el('a', { class: 'cta', href: sec.cta.url });
        cta.append(sec.cta.text + ' ', el('span', { class: 'arr' }, '\u2197'));
        card.appendChild(cta);
      }
      if (sec.pdf && sec.pdf.url) {
        const a = el('a', { href: sec.pdf.url });
        a.append(sec.pdf.text || 'Course programme (PDF)', el('span', { class: 'arr' }, ' \u2197'));
        card.appendChild(el('p', { class: 'pdf-link' }, ['More detail in the ', a, '.']));
      }
      if (sec.hint) card.appendChild(el('p', { class: 'hint' }, sec.hint));
      if (sec.points) {
        const ul = el('ul', { class: 'info-list' });
        sec.points.forEach(t => ul.appendChild(el('li', {}, t)));
        card.appendChild(ul);
      }
      const cal = sec.calendar;
      body = el('div', {}, [
        el('div', { class: 'prose' }, (sec.intro || []).map(t => el('p', {}, t))),
        card,
        cal ? el('figure', { class: 'calendar' }, [
          cal.title ? el('h3', {}, cal.title) : null,
          el('img', { src: cal.img, alt: cal.alt || '', loading: 'lazy' }),
          cal.caption ? el('figcaption', {}, cal.caption) : null
        ]) : null
      ]);
    } else if (sec.type === 'preview') {
      const c = sec.card;
      const link = el('a', { class: 'preview-card', href: c.url });
      if (c.shot) link.appendChild(el('img', { class: 'preview-shot', src: c.shot, alt: '', loading: 'lazy' }));
      const go = el('p', { class: 'go' });
      go.append(c.action || 'Open', el('span', { class: 'arr' }, '→'));
      link.appendChild(el('div', { class: 'preview-body' }, [
        el('h3', {}, c.title),
        c.desc ? el('p', { class: 'desc' }, c.desc) : null,
        go
      ]));
      body = el('div', {}, [
        link,
        sec.note ? el('p', { class: 'section-note' }, sec.note) : null
      ]);
    } else if (sec.type === 'links') {
      const grid = el('div', { class: 'cards' });
      sec.cards.forEach(c => {
        const card = el('a', { class: 'card link-card', href: c.url });
        if (c.icon) card.appendChild(iconEl(c.icon));
        card.appendChild(el('h3', {}, c.title));
        if (c.desc) card.appendChild(el('p', { class: 'desc' }, c.desc));
        const go = el('p', { class: 'go' });
        go.append(c.action || 'Open', el('span', { class: 'arr' }, '→'));
        card.appendChild(go);
        grid.appendChild(card);
      });
      body = el('div', {}, [
        grid,
        sec.note ? el('p', { class: 'section-note' }, sec.note) : null
      ]);
    } else if (sec.type === 'cooperation') {
      body = el('div', {}, [
        (function () {
          const ul = el('ul', { class: 'group-list' });
          (sec.groups || []).forEach(g => {
            const li = el('li', {}, [el('span', { class: 'group-name' }, g.title)]);
            if (g.text) li.append(' \u2014 ' + g.text);
            if (g.links && g.links.length) {
              const wrap = el('span', { class: 'group-links' });
              g.links.forEach(l => wrap.appendChild(el('a', { href: l.url, target: '_blank', rel: 'noopener' }, l.text)));
              li.appendChild(wrap);
            }
            if (g.panel) {
              const card = el('div', { class: 'info-card group-panel' });
              if (g.panel.cta) {
                const cta = el('a', { class: 'cta', href: g.panel.cta.url });
                cta.append(g.panel.cta.text + ' ', el('span', { class: 'arr' }, '\u2197'));
                card.appendChild(cta);
              }
              if (g.panel.hint) card.appendChild(el('p', { class: 'hint' }, g.panel.hint));
              if (g.panel.instructions) {
                const inner = el('ul', { class: 'info-list' });
                g.panel.instructions.forEach(t => inner.appendChild(el('li', {}, t)));
                card.appendChild(inner);
              }
              li.appendChild(card);
            }
            ul.appendChild(li);
          });
          return el('div', { class: 'prose' }, ul);
        })(),
        sec.sub ? (function () {
          const grid = el('div', { class: 'duo-grid' });
          (sec.sub.cards || []).forEach(c => {
            const card = el('a', { class: 'duo-card', href: c.url });
            if (c.shot) card.appendChild(el('img', { class: 'duo-shot', src: c.shot, alt: '', loading: 'lazy' }));
            card.appendChild(el('h4', {}, c.title));
            const go = el('p', { class: 'go' });
            go.append(c.action || 'Open', el('span', { class: 'arr' }, '\u2192'));
            card.appendChild(go);
            grid.appendChild(card);
          });
          return el('div', { class: 'subblock' }, [
            el('h3', {}, sec.sub.title),
            el('div', { class: 'prose' }, (sec.sub.body || []).map(t => el('p', {}, t))),
            grid
          ]);
        })() : null
      ]);
    } else if (sec.type === 'contact') {
      const left = el('div', {}, [
        (function () {
          const cta = el('a', { class: 'cta', href: sec.matrix.url });
          cta.append(sec.matrix.text + ' ', el('span', { class: 'arr' }, '↗'));
          return cta;
        })(),
        el('p', { class: 'contact-note' }, sec.matrix.note)
      ]);
      const dl = el('dl');
      dl.appendChild(el('dt', {}, 'Email'));
      sec.emails.forEach(e => {
        const dd = el('dd');
        dd.appendChild(el('a', { href: 'mailto:' + e }, e));
        dl.appendChild(dd);
      });
      dl.appendChild(el('dt', {}, 'Address'));
      sec.addresses.forEach(a => dl.appendChild(el('dd', {}, a)));
      const right = el('div', { class: 'contact-list' }, dl);
      body = el('div', { class: 'contact-grid' }, [left, right]);
    }

    const section = el('section', { class: 'block', id: secId(sec) }, [wrap([head, body])]);
    app.appendChild(section);
  });

  // --- floating section nav ---
  const nav = el('nav', { class: 'floatnav', 'aria-label': 'Sections' });
  const navList = el('ul');
  const navLinks = data.sections.map(sec => {
    const a = el('a', { href: '#' + secId(sec) }, [
      el('span', { class: 'fn-label' }, sec.eyebrow)
    ]);
    a.addEventListener('click', (e) => {
      const target = document.getElementById(secId(sec));
      if (!target) return;
      e.preventDefault();
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      history.replaceState(null, '', '#' + secId(sec));
    });
    navList.appendChild(el('li', {}, a));
    return a;
  });
  nav.appendChild(navList);
  document.body.appendChild(nav);

  // Highlight the section currently occupying the top of the viewport
  const sections = data.sections.map(sec => document.getElementById(secId(sec)));
  const setActive = () => {
    let current = -1;
    sections.forEach((s, i) => {
      if (s && s.getBoundingClientRect().top <= 120) current = i;
    });
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) {
      current = sections.length - 1;
    }
    navLinks.forEach((a, i) => a.classList.toggle('is-active', i === current));
    const active = navLinks[current];
    if (active && navList.scrollWidth > navList.clientWidth) {
      const l = active.offsetLeft, r = l + active.offsetWidth;
      if (l < navList.scrollLeft) navList.scrollLeft = l - 8;
      else if (r > navList.scrollLeft + navList.clientWidth) navList.scrollLeft = r - navList.clientWidth + 8;
    }
  };

  let ticking = false;
  const onScroll = () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { setActive(); ticking = false; });
  };
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();

  // --- footer ---
  const fWrap = document.querySelector('footer.site .wrap');
  fWrap.appendChild(el('span', {}, data.footer.left));
  const right = el('span', {}, data.footer.right.label + ': ');
  right.appendChild(el('a', { href: data.footer.right.url }, data.footer.right.text));
  fWrap.appendChild(right);
})();
</script>

</body>
</html>
